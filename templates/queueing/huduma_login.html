{% extends 'queueing/huduma_base.html' %}

{% block title %}Huduma Login{% endblock %}
{% block page_heading %}Huduma Kenya{% endblock %}
{% block page_subheading %}Verify.{% endblock %}

{% block content %}
<div class="card" style="max-width: 760px;">
    <div class="card-title">
        <h3>Login</h3>
        
    </div>

    <form method="POST">
        {% csrf_token %}

        <div class="grid-2">
            <div>
                <label for="national_id">National ID</label>
                <input
                    type="text"
                    name="national_id"
                    id="national_id"
                    value="{{ applicant.national_id }}"
                    required
                >
            </div>

            <div>
                <label for="first_name">Full Name</label>
                <input
                    type="text"
                    name="first_name"
                    id="first_name"
                    value="{{ applicant.full_name|cut:' '|truncatechars:20 }}"
                    required
                >
            </div>
        </div>

        <div class="grid-2">
            <input type="hidden" name="mother_first_name" id="mother_first_name" value="N/A">

            <div>
                <label for="phone">Phone</label>
                <input
                    type="text"
                    name="phone"
                    id="phone"
                    value="{{ applicant.phone_number }}"
                    required
                >
            </div>
        </div>

        <label for="email">Email</label>
        <input
            type="email"
            name="email"
            id="email"
            value="{{ applicant.email }}"
            required
        >

        <div class="btn-row">
            <button type="submit" class="btn btn-primary">Continue</button>
            <a href="{% url 'applicant_dashboard' %}" class="btn btn-secondary">Back</a>
        </div>
    </form>
</div>
{% endblock %}

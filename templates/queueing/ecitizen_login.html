{% extends 'queueing/ecitizen_base.html' %}

{% block title %}Login{% endblock %}
{% block page_subheading %}Login{% endblock %}

{% block content %}
<div class="card" style="max-width: 560px; margin: 0 auto;">
    <div class="card-title">
        <h3>Login</h3>
    </div>

    <form method="POST">
        {% csrf_token %}

        <label for="national_id">National ID</label>
        <input
            type="text"
            name="national_id"
            id="national_id"
            value="{{ applicant.national_id }}"
            required
        >

        <label for="password">Password</label>
        <input
            type="password"
            name="password"
            id="password"
            required
        >

        <div class="btn-row">
            <button type="submit" class="btn btn-primary">Continue</button>
        </div>
    </form>
</div>
{% endblock %}
